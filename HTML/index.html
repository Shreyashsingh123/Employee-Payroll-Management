<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employee Payroll</title>
    <!-- to take design without using css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">  
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../Styles/form.css">
</head>
  <body>
    <nav class="navbar bg-white border-bottom">
      <div class="header">
        <img id="img"src="https://img.icons8.com/ios-filled/50/82a70c/user-group-man-man.png" />
        <div>
          <span id="emp"class="ms-2 fw-bold">Employee</span><br>
          <span class="ms-1 fw-bold text-secondary">PAYROLL</span>
        </div>
      </div>
    </nav>
    
    <!-- To make form in a div and put it in center -->
<div class="container bg-light">
 <!-- my margin from top and bottom , container 5 for making page content center -->
 
  <div class="row justify-content-center">

<!-- to make row nad make card horizontal center -->
   <div class="col-md-8 ">
    
 <div class="card shadow-sm mt-4 ">
    <div class="card-body  p-5">
    <h4 class="text-start mb-4"> Employee Payroll Form   </h4>
    
    <form id="empform" >

 <!-- form code is started -->
<div class="mb-3 row">
    <label class="col-sm-3 col-form-label"> Name </label>
    <div class="col-sm-8">
     <input type="text" class="form-control"  name="name" id="name">
     <p id="n" style="color:red; display: none ">enter name *</p>
    </div>
</div>                          

<div class="row mb-3">
  <label class="col-sm-3 col-form-label">Profile image</label>
  <div class="col-sm-9 d-flex gap-5">
    <div class="col-sm-9">
    <input type="radio" name="profile" value="../Assets/profile1.jpg">
    <img src="../Assets/profile1.jpg" class="profile-img" style="height: 45px; width: 45px;">
    
    <input type="radio" name="profile" value="../Assets/profile2.jpg">
    <img src="../Assets/profile2.jpg" class="profile-img" style="width:45px; height: 45px;">
    <input type="radio" name="profile" value="../Assets/profile3.jpg">
    <img src="../Assets/profile3.jpg" class="profile-img" style="height: 45px; width:45px;">
    <input type="radio" name="profile" value="../Assets/profile4.jpg">
    <img src="../Assets/profile4.jpg" class="profile-img" style="width: 45px; height: 45px;"><br>
    <p id="pi" style="color:red; display: none ">select image *</p>
  </div>
  </div>
</div>

<div class="my-3 row align-items-center">
  <label class="col-sm-3 col-form-label">Gender:</label>
  <div class="col-sm-9 d-flex align-items-center gap-3">
    <div class="form-check form-check-inline">
      <input class="form-check-input" type="radio" name="gender" value="Male">
      <label class="form-check-label">Male</label>
    </div>

    <div class="form-check form-check-inline">
      <input class="form-check-input" type="radio" name="gender" value="female">
      <label class="form-check-label">Female</label>
    </div>
  </div>
  <p id="g" style="color:red; padding-left: 13vw; display: none;">select gender *</p>
</div>

<div class="mb-3 row align-items-center">
  <label class="col-sm-3 col-form-label">Department</label>
  <div class="col-sm-9 d-flex flex-wrap align-items-center gap-2">
    <div class="form-check form-check-inline">
      <input class="form-check-input" type="checkbox" name="department" value="HR" id="depHR">
      <label class="form-check-label" for="depHR">HR</label>
    </div>

    <div class="form-check form-check-inline">
      <input class="form-check-input" type="checkbox" name="department" value="Finance" id="depFinance">
      <label class="form-check-label" for="depFinance">Finance</label>
    </div>

    <div class="form-check form-check-inline">
      <input class="form-check-input" type="checkbox" name="department" value="Sales" id="depSales">
      <label class="form-check-label" for="depSales">Sales</label>
    </div>

    <div class="form-check form-check-inline">
      <input class="form-check-input" type="checkbox" name="department" value="Engineer" id="depEngineer">
      <label class="form-check-label" for="depEngineer">Engineer</label>
    </div>

    <div class="form-check form-check-inline">
      <input class="form-check-input" type="checkbox" name="department" value="Others" id="depOthers">
      <label class="form-check-label" for="depOthers">Others</label>
    </div>
  </div>

  <p id="d" style="color:red; padding-left: 13vw; display: none;">select department *</p>
</div>

 <!-- below is department code -->
 <div class="mb-3 row">
    <label class="col-sm-3 col-form-label"> Salary    </label>
    <div class="col-sm-6">
      <div class="col-sm-7">
         <select class="form-select" id="salary">
             <option value="">Select Salary</option>
             <option value="30000">30000</option>
             <option value="40000">40000</option>
             <option value="50000">50000</option>
         </select>
     </div>
     <p id="s" style="color:red; display: none ">select salary *</p>
    </div>
 </div>
 
 <!-- start and end date -->
<div class="mb-3 row">
    <label class="col-sm-3 col-form-label">  Start Date </label>
    <div class="col-sm-7 d-flex gap-2">
    <select class="form-select" id="day">
      <!-- from-select for dropdown feature -->
      <option selected>Day</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
      <option value="6">6</option>
      <option value="7">7</option>
      <option value="8">8</option>
      <option value="9">9</option>
      <option value="10">10</option>
      <option value="11">11</option>
      <option value="12">12</option>
      <option value="13">13</option>
      <option value="14">14</option>
      <option value="15">15</option>
      <option value="16">16</option>
      <option value="17">17</option>
      <option value="18">18</option>
      <option value="19">19</option>
      <option value="20">20</option>
      <option value="21">21</option>
      <option value="22">22</option>
      <option value="23">23</option>
      <option value="24">24</option>
      <option value="25">25</option>
      <option value="26">26</option>
      <option value="27">27</option>
      <option value="28">28</option>
      <option value="29">29</option>
      <option value="30">30</option>
      <option value="31">31</option>
    </select>
    <select class="form-select" id="month">
      <option selected>Month</option>
      <option value="Jan">Jan</option>
      <option value="Feb">Feb</option>
      <option value="Mar">Mar</option>
      <option value="Apr">Apr</option>
      <option value="May">May</option>
      <option value="Jun">Jun</option>
      <option value="Jul">Jul</option>
      <option value="Aug">Aug</option>
      <option value="Sept">Sept</option>
      <option value="Oct">Oct</option>
      <option value="Nov">Nov</option>
      <option value="Dec">Dec</option>

    </select>               
    <select class="form-select" id="year">
            <option selected>Year</option>
              <option value="2000">2000</option>
              <option value="2001">2001</option>
              <option value="2002">2002</option>
              <option value="2003">2003</option>
              <option value="2004">2004</option>
              <option value="2005">2005</option>
              <option value="2006">2006</option>
              <option value="2007">2007</option>
              <option value="2008">2008</option>
              <option value="2009">2009</option>
              <option value="2010">2010</option>
              <option value="2011">2011</option>
              <option value="2012">2012</option>
              <option value="2013">2013</option>
              <option value="2014">2014</option>
              <option value="2015">2015</option>
              <option value="2016">2016</option>
              <option value="2017">2017</option>
              <option value="2018">2018</option>
              <option value="2019">2019</option>
              <option value="2020">2020</option>
              <option value="2021">2021</option>
              <option value="2022">2022</option>
              <option value="2023">2023</option>
              <option value="2024">2024</option>
              <option value="2025">2025</option>
    </select>
  </div>
  <p id="dateError" style="color:red; display:none"> select  a valid start date *</p>
</div>
<!-- notes area -->

<div class="mb-4 row">
    <label class="col-sm-3 col-form-label"> Notes </label>
  <div class="col-sm-8">
     <textarea class="form-control" rows="3" placeholder="Enter Notes:"></textarea>
  </div>
</div>

<!-- niche buttons submit reset etc hai.. -->

<div class="d-flex justify-content-between">
    <button  id="canc" type="button" class="btn btn-outline-secondary" onclick="window.location.href='EmpTable.html'">Cancel  </button>
    <!-- table url for cancell -->
 <div>
    <button  id="sub" type="submit"class="btn btn-outline-secondary me-2">Submit</button>  
        <button id="res" type="reset" class="btn btn-outline-secondary"> Reset  </button>   
 </div>
</div>

</div>
</div>
</form>
</div>
</div>
</div>
