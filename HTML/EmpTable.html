<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Employee Payroll</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../Styles/table.css">
</head>

<body class="bg-light">

<!-- HEADER -->

<nav class="navbar bg-white border-bottom">
  <div class="header">
    <img id="img"src="https://img.icons8.com/ios-filled/50/82a70c/user-group-man-man.png" />
    <div>
      <span id="emp"class="ms-2 fw-bold ">Employee</span><br>
      <span class="ms-1 fw-bold text-secondary">PAYROLL</span>
    </div>
  </div>

</nav>


<!-- Main Content -->

<div class="container mt-4 ">

  <!-- Title and Buttons-->
  
  <div class="d-flex justify-content-between align-items-center mb-3 bg-light">
    <h4 class="fw-semibold shadow-sm">Employee Details</h4>

    <div>
     <button class="btn btn-light align-items-center gap-2 rounded" id="opensearch" type="button">
  <i class="bi bi-search" id="searchIcon"></i>
  <input type="text"
         id="searchInput"
         class="form-control d-none rounded"
         placeholder="Search...">
</button>

      <button class="btn text-white px-3" style="background:#82A70C; ;">
        <i class="bi bi-plus-lg"></i>
        <a href="index.html" class="btn add-user-btn" style="background:#82A70C;color:white">
        Add User
      </a>
      </button>
    </div>
  </div>

  <!-- Table using bootstrap -->
  <div class="table-responsive bg-white shadow-sm ">
    <table class="table  align-middle text-center bg-white shadow-sm">
      <thead class="table-secondary "   >
        <tr >
          
          <th class="text-start" style="padding-left: 4.5vw;">NAME</th>
          <th>GENDER</th>
          <th>DEPARTMENT</th>
          <th>SALARY</th>
          <th>START DATE</th>
          <th>ACTIONS</th>
        </tr>
      </thead>

      <tbody id="employeeTableBody">
        
      </tbody>
    </table>
  </div>
</div>


<script src="../JS/TableDOM.js"></script>


<!-- <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="../JS/JqueryTable.js"></script> -->

</body>
</html>
